name: Build Android APK & AAB

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipe Build yang diinginkan'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - release_only
          - debug_only

jobs:
  build:
    name: Build & Package Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Setup Environment File (.env)
        run: |
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi
          # Injeksi secrets jika ada di GitHub Secrets
          if [ -n "${{ secrets.IRONSOURCE_APP_KEY }}" ]; then
            sed -i "s|^IRONSOURCE_APP_KEY=.*|IRONSOURCE_APP_KEY=${{ secrets.IRONSOURCE_APP_KEY }}|" .env
          fi
          if [ -n "${{ secrets.IRONSOURCE_INTERSTITIAL_AD_UNIT_ID }}" ]; then
            sed -i "s|^IRONSOURCE_INTERSTITIAL_AD_UNIT_ID=.*|IRONSOURCE_INTERSTITIAL_AD_UNIT_ID=${{ secrets.IRONSOURCE_INTERSTITIAL_AD_UNIT_ID }}|" .env
          fi

      - name: Setup Release Keystore (Signature Key Permanen)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # 1. Jika pengguna menyediakan KEYSTORE_BASE64 di GitHub Secrets, decode
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
            echo "Keystore didecode dari GitHub Secret KEYSTORE_BASE64."
          elif [ -f "my-upload-key.base64" ] && [ ! -f "my-upload-key.jks" ]; then
            # 2. Jika my-upload-key.base64 ada di repo
            base64 -d my-upload-key.base64 > my-upload-key.jks
            echo "Keystore didecode dari file repo my-upload-key.base64."
          elif [ -f "my-upload-key.jks" ]; then
            echo "Keystore permanen my-upload-key.jks ditemukan di repository."
          else
            echo "Membuat keystore permanen fallback..."
            keytool -genkeypair -v -keystore my-upload-key.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "SuratPendek2026" -keypass "SuratPendek2026" \
              -dname "CN=GecckoCreator, OU=Mobile, O=SuratPendek, L=Jakarta, ST=Jakarta, C=ID"
          fi

      - name: Build Release APK & Bundle (AAB)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'SuratPendek2026' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'SuratPendek2026' }}
        run: |
          ./gradlew :app:assembleRelease :app:bundleRelease :app:assembleDebug

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Release AAB (Google Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
